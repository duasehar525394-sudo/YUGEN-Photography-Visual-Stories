<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Services| YŪGEN Photography</title>
    <style>

        body {
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
            border: 2px solid #b08a57;
            background-color: #151311;
            color: #eee8df;
            font-family: Arial, sans-serif;
        }

        header {
            display: grid;
            grid-template-columns: 70px 1fr 2fr;
            background-color: black;
            color: white;
            align-items: center;
            gap: 15px;
            padding: 22px 5%;
            border-bottom: 1px solid #333333;
        }

        .logo img {
            width: 70px;
            height: 50px;
            object-fit: contain;
        }

        .brand-name {
            display: grid;
            gap: 2px;
            font-family: Georgia, serif;
            font-size: 22px;
        }

        .brand-name span {
            font-family: serif;
            font-size: 12px;
        }

        nav {
            display: flex;
            justify-content: flex-end;
            gap: 25px;
        }

        nav a {
            position: relative;
            color: white;
            text-decoration: none;
            display: inline-block;
            padding: 5px 8px;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        nav a::after {
            position: absolute;
            right: 8px;
            bottom: 0;
            left: 8px;
            height: 1px;
            background-color: #b08a57;
            content: "";
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        nav a:hover {
            color: #d9bd9e;
            transform: translateY(-4px);
        }

        nav a:hover::after {
            transform: scaleX(1);
        }

        main {
            padding: 0;
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 42px 5% 55px;
            background-color: #171513;
            animation: slide-in 0.8s ease-out both;
        }

        @keyframes slide-in {
            from {
                opacity: 0;
                transform: translateX(30px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .services-title {
            grid-column: 1 / -1;
            margin: 0 0 12px;
            padding: 0 0 18px;
            border-bottom: 1px solid #b08a57;
            color: #eee4d8;
            font-family: Georgia, serif;
            font-weight: normal;
            font-size: 38px;
        }

        .project {
            background-color: #25201c;
            transition: transform 0.4s ease;
        }

        .project:hover {
            transform: translateY(-5px);
        }

        .project img {
            display: block;
            width: 100%;
            height: 280px;
            object-fit: cover;
            border: 1px solid #b08a57;
            box-sizing: border-box;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .project img:hover {
            transform: translateY(-2px);
            border-color: #d9bd9e;
            box-shadow: 0 0 0 1px rgba(176, 138, 87, 0.4);
        }

        .project-label {
            padding: 10px 14px 14px;
        }

        .project-label h2 {
            margin: 8px 0 4px;
            font-family: Georgia, serif;
            font-weight: normal;
            color: #eee4d8;
        }

        .project-label p {
            margin-top: 0;
            color: #b8a999;
        }

        @media screen and (max-width: 768px) {
    header {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 10px;
    }

    nav {
        justify-content: center;
        gap: 15px;
    }

    .project-grid {
        grid-template-columns: 1fr;
    }
}
    </style>
</head>
<body>
    <header class="site-header">
        <div class="logo">
            <img src="logo-white.png" alt="Yūgen emblem">
        </div>
        <div class="brand-name">
            <strong>YŪGEN</strong>
            <span lang="ja">幽玄</span>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section class="project-grid">
            <h1 class="services-title">Our Services & Portfolio</h1>
            <div class="project">
                <img src="Portrait Photography.jpg" alt="Black-and-white portrait in soft studio light">
                <div class="project-label">
                    <h2>Quiet Presence</h2>
                    <p>Portraits</p>
                </div>
            </div>
            <div class="project">
                <img src="Modern Aesthetic Architecture.jpg" alt="Modern home interior at blue hour">
                <div class="project-label">
                    <h2>Spaces to Stay</h2>
                    <p>Architecture</p>
                </div>
            </div>
            <div class="project">
                <img src="Event Editorial.jpg" alt="Guests talking at an evening gallery event">
                <div class="project-label">
                    <h2>An Evening Together</h2>
                    <p>Events</p>
                </div>
            </div>
            <div class="project">
                <img src="Landscape img.jpg" alt="Quiet morning view of mountains from a cabin">
                <div class="project-label">
                    <h2>Morning Light</h2>
                    <p>Travel</p>
                </div>
            </div>
            <div class="project">
                <img src="Food.jpg" alt="Grilled fish served on a plate in candlelight">
                <div class="project-label">
                    <h2>At the Table</h2>
                    <p>Food photography</p>
                </div>
            </div>
            <div class="project">
                <img src="Still Life.jpg" alt="Vase of dried flowers and a wooden bowl in a calm interior">
                <div class="project-label">
                    <h2>Quiet Objects</h2>
                    <p>Still life</p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
