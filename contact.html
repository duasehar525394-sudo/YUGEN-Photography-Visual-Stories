<!DOCTYPE html>
<html lang="en">    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YŪGEN | Photography Visual Stories</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
            border: 2px solid #b08a57;
            background-color: #151311;
            color: #eee8df;
            font-family: Arial, sans-serif;
        }

        nav {
            display: flex;
            justify-content: flex-end;
            gap: 25px;
        }

        #header {
            display: grid;
            grid-template-columns: 70px 1fr 2fr;
            align-items: center;
            gap: 15px;
            padding: 22px 5%;
            border-bottom: 1px solid #333;
            background-color: #000;
            color: #fff;
        }

        .logo {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .logo img {
            width: 70px;
            height: 50px;
            object-fit: contain;
        }

        .brandname {
            display: grid;
            gap: 5px;
            font-family: "Times New Roman", serif;
            font-size: 22px;
        }

        .brandname span {
            font-family: serif;
            font-size: 12px;
        }

        nav a {
            position: relative;
            color: #fff;
            text-decoration: none;
            display: inline-block;
            padding: 5px 8px;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        nav a::after {
            position: absolute;
            right: 8px;
            bottom: 0;
            left: 8px;
            height: 1px;
            background-color: #b08a57;
            content: "";
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        nav a:hover {
            color: #d9bd9e;
            transform: translateY(-4px);
        }

        nav a:hover::after {
            transform: scaleX(1);
        }
        
        .contact {
            padding: 48px 5%;
            text-align: left;
            background-color: #25201c;
            color: #eee8df;
        }

        .contact h2 {
            margin: 0 0 12px;
            padding: 0 0 18px;
            border-bottom: 1px solid #b08a57;
            color: #eee8df;
            font-family: Georgia, serif;
            font-weight: normal;
            font-size: 32px;
        }

        .contact-layout {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 40px;
            margin-top: 30px;
        }

        .contact-details {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .contact-details li {
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: transform 0.3s ease;
        }

        .contact-details li:hover {
            transform: translateY(-4px);
        }

        .contact-details li:hover .contact-label {
            color: #b08a57;
        }

        .contact-label {
            color: #b8a999;
            font-size: 14px;
            margin: 0;
        }

        .contact-value {
            margin: 0;
            color: #eee8df;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            animation: slide-in 0.8s ease-out both;
        }

        @keyframes slide-in {
            from {
                opacity: 0;
                transform: translateX(30px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group input,
        .form-group textarea {
            background-color: #171513;
            border: 1px solid #b08a57;
            color: #eee8df;
            padding: 10px;
            font-family: inherit;
            font-size: 14px;
            box-sizing: border-box;
            width: 100%;
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        .submit-btn {
            background-color: #eee8df;
            color: #151311;
            border: 3px solid #b08a57;
            padding: 12px 20px;
            font-weight: bold;
            cursor: pointer;
            align-self: flex-start;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-4px);
            background-color: #d9bd9e;
        }

        .form-group label {
            color: #b8a999;
            font-size: 14px;
            text-align: left;
        }

        @media screen and (max-width: 768px) {
            #header {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 10px;
            }

            nav {
                justify-content: center;
                gap: 15px;
            }

            .contact-layout {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>
<body>
    <header id="header">
        <div class="logo">
            <img src="logo-white.png" alt="YŪGEN logo">
        </div>
        <div class="brandname">
            <strong>YŪGEN</strong>
            <span lang="ja">幽玄</span>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section class="contact">
            <h2>Get in Touch</h2>
            <p>Have a project in mind? We would love to hear from you.</p>

            <div class="contact-layout">
                <aside>
                    <ul class="contact-details">
                        <li>
                            <p class="contact-label">Instagram</p>
                            <p class="contact-value">@yugen.visuals.demo</p>
                        </li>
                        <li>
                            <p class="contact-label">Email</p>
                            <p class="contact-value">hello@yugen.example</p>
                        </li>
                        <li>
                            <p class="contact-label">Phone</p>
                            <p class="contact-value">+92 300 0000000</p>
                        </li>
                    </ul>
                </aside>

                <form class="contact-form">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Send Message</button>
                </form>
            </div>
        </section>
    </main>

</body>
</html>
